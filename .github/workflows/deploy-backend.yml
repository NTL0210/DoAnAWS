name: Backend Deploy — Lambda + Infra

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  NODE_VERSION: "22"

  
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Run tests (non-blocking)
        run: npm test || true

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm install --include=optional
      - run: npm run build

      - name: Bundle Lambda with esbuild
        run: |
          npm install --save-dev esbuild
          npx esbuild dist/lambda-handler.js \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=cjs \
            --outfile=dist/bundle.js

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Lambda to be ready
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Lambda (esbuild bundle)
        run: |
          test -f dist/bundle.js
          rm -f "$RUNNER_TEMP/bundle-deploy.zip"
          zip -q -j "$RUNNER_TEMP/bundle-deploy.zip" dist/bundle.js
          unzip -t "$RUNNER_TEMP/bundle-deploy.zip"
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://$RUNNER_TEMP/bundle-deploy.zip \
            --region ${{ env.AWS_REGION }}
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Update Lambda environment variables
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
          aws lambda update-function-configuration \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --environment "Variables={DATA_PROVIDER=dynamodb,DYNAMODB_TABLE_MAIN=ai-meeting-platform,NODE_ENV=production,ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS || 'https://d1gdsnv8exdah.cloudfront.net' }},COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }},COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }},VOICE_RECORDINGS_BUCKET=${{ vars.VOICE_RECORDINGS_BUCKET || secrets.VOICE_RECORDINGS_BUCKET || 'ai-meeting-workforce-audio' }},AUDIO_BUCKET=${{ vars.AUDIO_BUCKET || secrets.AUDIO_BUCKET || 'ai-meeting-workforce-audio' }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }},VOICE_ASG_NAME=${{ vars.VOICE_ASG_NAME || 'app-asg' }},TURN_USERNAME=${{ vars.NEXT_PUBLIC_TURN_USERNAME || 'ai-meeting-turn' }},TURN_CREDENTIAL=${{ secrets.TURN_CREDENTIAL || secrets.NEXT_PUBLIC_TURN_CREDENTIAL }},FORCE_TURN=${{ vars.NEXT_PUBLIC_FORCE_TURN || 'false' }}}" \
            --region ${{ env.AWS_REGION }}
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
