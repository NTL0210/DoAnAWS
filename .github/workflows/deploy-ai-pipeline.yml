name: Deploy AI Pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ai-pipeline.yml'
      - 'backend/lambdas/ai-processing/**'
      - 'backend/lambdas/shared/**'
      - 'backend/src/dynamodb/**'
      - 'backend/template-ai-pipeline.yml'
      - 'backend/statemachine/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: ai-pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        run: npm ci --include=optional
        working-directory: backend

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM source paths
        run: |
          test -d lambdas/ai-processing
          test -f lambdas/ai-processing/package.json
          test -f statemachine/pipeline.asl.json
          sam validate --template template-ai-pipeline.yml
        working-directory: backend

      - name: SAM Build & Deploy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SNS_NOTIFY_EMAIL: ${{ secrets.SNS_NOTIFY_EMAIL }}
          TABLE_NAME: ${{ secrets.TABLE_NAME }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          normalize_secret() {
            printf '%s' "$1" | tr -d '\r\n[:space:]'
          }

          GEMINI_API_KEY=$(normalize_secret "$GEMINI_API_KEY")
          TABLE_NAME=$(normalize_secret "$TABLE_NAME")
          SNS_NOTIFY_EMAIL=$(normalize_secret "$SNS_NOTIFY_EMAIL")
          S3_BUCKET=$(normalize_secret "$S3_BUCKET")

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing required GitHub secret GEMINI_API_KEY"
            exit 1
          fi
          if [ -z "$TABLE_NAME" ]; then
            echo "::error::Missing required GitHub secret TABLE_NAME"
            exit 1
          fi
          if [ -z "$SNS_NOTIFY_EMAIL" ]; then
            echo "::error::Missing required GitHub secret SNS_NOTIFY_EMAIL"
            exit 1
          fi
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Missing required GitHub secret S3_BUCKET"
            exit 1
          fi

          if ! printf '%s' "$TABLE_NAME" | grep -Eq '^[A-Za-z0-9_.-]{3,255}$'; then
            echo "::error::TABLE_NAME has an invalid DynamoDB table-name format after normalization"
            exit 1
          fi

          PARAMETER_OVERRIDES=(
            "GeminiApiKey=$GEMINI_API_KEY"
            "GeminiModel=gemini-2.5-flash"
            "NotifyEmail=$SNS_NOTIFY_EMAIL"
            "ExistingTableName=$TABLE_NAME"
          )

          sam build --template template-ai-pipeline.yml
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "sam-artifacts/$STACK_NAME" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMETER_OVERRIDES[@]}"
        working-directory: backend
