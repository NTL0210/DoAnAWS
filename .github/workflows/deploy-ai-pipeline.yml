name: Deploy AI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'backend/lambdas/ai-processing/**'
      - 'backend/lambdas/shared/**'
      - 'backend/src/dynamodb/**'
      - 'backend/template-ai-pipeline.yml'
      - 'backend/statemachine/**'

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: ai-pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        run: npm ci --include=optional
        working-directory: backend

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build & Deploy
        run: |
          sam build --template template-ai-pipeline.yml
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              GeminiApiKey=${{ secrets.GEMINI_API_KEY }} \
              GeminiModel=gemini-2.5-flash \
              NotifyEmail=${{ secrets.SNS_NOTIFY_EMAIL }} \
              ExistingTableName=${{ secrets.TABLE_NAME }}
        working-directory: backend
