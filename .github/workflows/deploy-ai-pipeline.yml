name: Deploy AI Pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ai-pipeline.yml'
      - 'backend/lambdas/ai-processing/**'
      - 'backend/lambdas/shared/**'
      - 'backend/src/dynamodb/**'
      - 'backend/template-ai-pipeline.yml'
      - 'backend/statemachine/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: ai-pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clean up stack if stuck in rollback state
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "STACK_NOT_FOUND")

          echo "Current stack status: $STACK_STATUS"

          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "ROLLBACK_FAILED" ] || [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "::warning::Stack ${{ env.STACK_NAME }} is in $STACK_STATUS. Deleting before re-deploy..."
            aws cloudformation delete-stack \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }}
            aws cloudformation wait stack-delete-complete \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }}
            echo "Stack deleted successfully."
          else
            echo "Stack is clean or does not exist. Proceeding."
          fi

      - name: Clean up orphaned AudioBucket from failed deploys
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region ${{ env.AWS_REGION }})
          BUCKET="ai-meeting-audio-${ACCOUNT_ID}-${{ env.STACK_NAME }}"

          # Step 1: check if bucket exists
          if ! aws s3api head-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "No orphaned bucket found. Proceeding."
            exit 0
          fi

          # Step 2: check stack status — ONLY delete when first deploy never succeeded
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Bucket found. Stack status: $STACK_STATUS"

          if [ "$STACK_STATUS" != "ROLLBACK_COMPLETE" ] && [ "$STACK_STATUS" != "REVIEW_IN_PROGRESS" ] && [ "$STACK_STATUS" != "NOT_FOUND" ]; then
            echo "Stack status is '$STACK_STATUS', not 'ROLLBACK_COMPLETE', 'REVIEW_IN_PROGRESS', or 'NOT_FOUND'. Skipping bucket deletion to protect data."
            exit 0
          fi

          # Step 3: double-check bucket is empty before deleting
          OBJECT_COUNT=$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --region ${{ env.AWS_REGION }} \
            --query 'length(Contents || [])' \
            --output text 2>/dev/null || echo "0")

          if [ "$OBJECT_COUNT" != "0" ]; then
            echo "::error::Bucket '$BUCKET' is not empty ($OBJECT_COUNT objects). Refusing auto-delete to prevent data loss."
            exit 1
          fi

          # Step 4: both conditions met — safe to delete
          echo "::warning::Stack ($STACK_STATUS) and bucket is empty. Deleting orphaned bucket..."
          aws s3api delete-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }}
          echo "Bucket deleted."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        run: npm ci --include=optional
        working-directory: backend

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM source paths
        run: |
          test -d lambdas/ai-processing
          test -f lambdas/ai-processing/package.json
          test -f statemachine/pipeline.asl.json
          sam validate --template template-ai-pipeline.yml
        working-directory: backend

      - name: SAM Build & Deploy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SNS_NOTIFY_EMAIL: ${{ secrets.SNS_NOTIFY_EMAIL }}
          TABLE_NAME: ${{ secrets.TABLE_NAME }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AUDIO_BUCKET_NAME: ${{ vars.AUDIO_BUCKET || secrets.AUDIO_BUCKET || 'ai-meeting-workforce-audio' }}
        run: |
          normalize_secret() {
            printf '%s' "$1" | tr -d '\r\n[:space:]'
          }

          require_secret() {
            if [ -z "$2" ]; then
              echo "::error::Missing required GitHub secret $1"
              exit 1
            fi
          }

          describe_failed_changeset() {
            local stack_name="$1"
            local change_set_id

            change_set_id=$(aws cloudformation list-change-sets \
              --stack-name "$stack_name" \
              --region "$AWS_REGION" \
              --query 'reverse(sort_by(Summaries,&CreationTime))[0].ChangeSetId' \
              --output text 2>/dev/null || true)

            if [ -n "$change_set_id" ] && [ "$change_set_id" != "None" ]; then
              aws cloudformation describe-change-set \
                --change-set-name "$change_set_id" \
                --stack-name "$stack_name" \
                --region "$AWS_REGION" || true
            fi

            aws cloudformation describe-stack-events \
              --stack-name "$stack_name" \
              --region "$AWS_REGION" \
              --max-items 20 || true
          }

          GEMINI_API_KEY=$(normalize_secret "$GEMINI_API_KEY")
          TABLE_NAME=$(normalize_secret "$TABLE_NAME")
          SNS_NOTIFY_EMAIL=$(normalize_secret "$SNS_NOTIFY_EMAIL")
          S3_BUCKET=$(normalize_secret "$S3_BUCKET")
          AUDIO_BUCKET_NAME=$(normalize_secret "$AUDIO_BUCKET_NAME")

          require_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          require_secret TABLE_NAME "$TABLE_NAME"
          require_secret SNS_NOTIFY_EMAIL "$SNS_NOTIFY_EMAIL"
          require_secret S3_BUCKET "$S3_BUCKET"
          require_secret AUDIO_BUCKET_NAME "$AUDIO_BUCKET_NAME"

          if ! printf '%s' "$TABLE_NAME" | grep -Eq '^[A-Za-z0-9_.-]{3,255}$'; then
            echo "::error::TABLE_NAME has an invalid DynamoDB table-name format after normalization"
            exit 1
          fi

          aws sts get-caller-identity >/dev/null

          if ! aws dynamodb describe-table \
            --table-name "$TABLE_NAME" \
            --region "$AWS_REGION" \
            >/dev/null; then
            echo "::error::Cannot describe DynamoDB table '$TABLE_NAME' in $AWS_REGION. The table must exist in this region and the GitHub AWS user must allow dynamodb:DescribeTable. Apply backend/infra/iam/pipeline-github-actions-policy.json to the GitHub deploy user."
            exit 1
          fi

          PARAMETER_OVERRIDES=(
            "GeminiApiKey=$GEMINI_API_KEY"
            "GeminiModel=gemini-2.5-flash"
            "NotifyEmail=$SNS_NOTIFY_EMAIL"
            "ExistingTableName=$TABLE_NAME"
            "ExistingAudioBucketName=$AUDIO_BUCKET_NAME"
          )

          sam build --template template-ai-pipeline.yml

          set +e
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "sam-artifacts/$STACK_NAME" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMETER_OVERRIDES[@]}"
          deploy_status=$?
          set -e

          if [ "$deploy_status" -ne 0 ]; then
            describe_failed_changeset "$STACK_NAME"
            exit "$deploy_status"
          fi
        working-directory: backend
