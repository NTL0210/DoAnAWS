AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Processing Pipeline (audio -> Gemini -> DynamoDB -> SNS)

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Gemini API key from https://aistudio.google.com/apikey
  GeminiModel:
    Type: String
    Default: gemini-2.5-flash
  NotifyEmail:
    Type: String
    Default: ""
    Description: Email address for pipeline completion notifications
  ExistingTableName:
    Type: String
    Description: Existing DynamoDB table name from the main backend stack
    AllowedPattern: '^[A-Za-z0-9_.-]{3,255}$'

Conditions:
  HasNotifyEmail: !Not [!Equals [!Ref NotifyEmail, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 180
    MemorySize: 512
    Architectures: [arm64]

Resources:
  AudioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ai-meeting-audio-${AWS::AccountId}-${AWS::StackName}"
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveToGlacier
            Status: Enabled
            Prefix: uploads/
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 30

  NotifyTopic:
    Type: AWS::SNS::Topic

  NotifySubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotifyEmail
    Properties:
      TopicArn: !Ref NotifyTopic
      Protocol: email
      Endpoint: !Ref NotifyEmail

  AiLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/ai-processing/
      Handler: index.handler
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${AudioBucket.Arn}/*"

  SaveLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/ai-processing/
      Handler: save.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ExistingTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingTableName}"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${AudioBucket.Arn}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt AudioBucket.Arn

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    DependsOn:
      - AiLambda
      - SaveLambda
      - NotifyTopic
      - PipelineLogGroup
    Properties:
      Name: !Sub "ai-meeting-pipeline-${AWS::StackName}"
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        PromptLambdaArn: !GetAtt AiLambda.Arn
        SaveLambdaArn: !GetAtt SaveLambda.Arn
        NotifyTopicArn: !Ref NotifyTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt AiLambda.Arn
                - !GetAtt SaveLambda.Arn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref NotifyTopic
            - Sid: CloudWatchLogsDelivery
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !Sub "${PipelineLogGroup.Arn}:*"
        Level: ALL
        IncludeExecutionData: true
      Tracing:
        Enabled: true

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartSfn
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref PipelineStateMachine

  StartPipelineRule:
    Type: AWS::Events::Rule
    DependsOn:
      - PipelineStateMachine
      - EventBridgeRole
    Properties:
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref AudioBucket]
          object:
            key: [{ prefix: uploads/ }]
      Targets:
        - Arn: !Ref PipelineStateMachine
          Id: StartPipeline
          RoleArn: !GetAtt EventBridgeRole.Arn
          InputTransformer:
            InputPathsMap:
              bkt: $.detail.bucket.name
              key: $.detail.object.key
            InputTemplate: |
              {
                "action": "process-audio",
                "bucket": "<bkt>",
                "storageKey": "<key>",
                "meetingId": "<key>"
              }

  PipelineFailAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref PipelineStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref NotifyTopic]

Outputs:
  AudioBucketName:
    Value: !Ref AudioBucket
  StateMachineArn:
    Value: !Ref PipelineStateMachine
  AiLambdaName:
    Value: !Ref AiLambda
  SaveLambdaName:
    Value: !Ref SaveLambda
  NotifyTopicArn:
    Value: !Ref NotifyTopic
